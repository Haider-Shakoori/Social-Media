name: Isolated staging image validation
on:
  pull_request:
    paths:
      - 'deploy/staging/**'
      - '.dockerignore'
      - '.github/workflows/staging-container.yml'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Compose file
        run: |
          cp deploy/staging/.env.staging.example deploy/staging/.env.staging
          docker compose --env-file deploy/staging/.env.staging.example -f deploy/staging/compose.yaml config --quiet
          if grep -nE '(0\.0\.0\.0:(3000|4000|5432|6379)|/var/run/docker\.sock)' deploy/staging/compose.yaml; then
            echo 'Unsafe port binding or socket mount detected'
            exit 1
          fi
      - name: Build staging application image (no publishing)
        run: |
          docker build --file deploy/staging/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://socials.businessos.af/api/v1 \
            --build-arg NEXT_PUBLIC_SITE_URL=https://socials.businessos.af \
            --tag social-media-staging-ci:${{ github.sha }} .
