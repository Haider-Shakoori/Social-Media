name: Isolated staging image validation
on:
  pull_request:
    paths:
      - 'deploy/staging/**'
      - '.dockerignore'
      - '.github/workflows/staging-container.yml'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  push:
    branches: ['main']
    paths:
      - 'deploy/staging/**'
      - '.dockerignore'
      - '.github/workflows/staging-container.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  staging-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Compose file
        run: |
          cp deploy/staging/.env.staging.example deploy/staging/.env.staging
          docker compose --env-file deploy/staging/.env.staging.example -f deploy/staging/compose.yaml config --quiet
          if grep -nE '(0\.0\.0\.0:(3000|4000|5432|6379)|/var/run/docker\.sock)' deploy/staging/compose.yaml; then
            echo 'Unsafe port binding or socket mount detected'
            exit 1
          fi
      - name: Build staging application image (no publishing)
        run: |
          docker build --file deploy/staging/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://socials.businessos.af/api/v1 \
            --build-arg NEXT_PUBLIC_SITE_URL=https://socials.businessos.af \
            --tag social-media-staging/app:local .
      - name: Package GitHub-built image for VPS (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save social-media-staging/app:local | zstd -T2 -3 -o social-media-staging-image.tar.zst
          test -s social-media-staging-image.tar.zst
      - name: Publish prerelease image artifact (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="social-staging-${GITHUB_SHA:0:12}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Social-Media staging image ${GITHUB_SHA:0:12}" \
            --notes "GitHub CI-built staging Docker image, no credentials or production publication. Intended for isolated VPS testing."
          gh release upload "$tag" social-media-staging-image.tar.zst

